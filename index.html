<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giriş Yap - Google Hesapları</title>
<style>
    /* Google'ın Kullandığı Font */
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Roboto', Arial, sans-serif;
    }

    body {
        background-color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }

    .container {
        width: 100%;
        max-width: 450px;
        padding: 48px 40px 36px;
        border: 1px solid #dadce0;
        border-radius: 8px;
        text-align: center;
        background: #fff;
        margin: 20px;
        box-sizing: border-box;
    }

    .logo {
        width: 75px;
        height: 24px; /* Google logosu orantısı */
        margin-bottom: 10px;
    }

    .title {
        padding-bottom: 0;
        padding-top: 16px;
        font-size: 24px;
        font-weight: 400;
        line-height: 1.3333;
        margin-bottom: 0;
        margin-top: 0;
        color: #202124;
    }

    .subtitle {
        padding-bottom: 0;
        padding-top: 0;
        font-size: 16px;
        font-weight: 400;
        letter-spacing: 0.1px;
        line-height: 1.5;
        margin-bottom: 0;
        margin-top: 0;
        color: #202124;
    }

    .profile-area {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 10px;
        margin-bottom: 25px;
        gap: 12px;
    }

    .profile-icon {
        width: 20px;
        height: 20px;
        stroke: #5f6368;
        fill: none;
        stroke-width: 2;
    }

    .email-text {
        font-size: 14px;
        font-weight: 500;
        color: #202124;
        letter-spacing: 0.25px;
    }

    .input-group {
        margin-top: 15px;
        margin-bottom: 6px;
        text-align: left;
    }

    .input-box {
        width: 100%;
        height: 56px;
        padding: 13px 15px;
        font-size: 16px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        outline: none;
        background: #fff;
        color: #202124;
        transition: border 0.2s;
    }

    .input-box:focus {
        border: 2px solid #1a73e8;
        padding: 12px 14px;
    }

    .checkbox-area {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        margin-top: 5px;
        margin-bottom: 40px;
    }

    .checkbox-area input {
        width: 18px;
        height: 18px;
        margin-right: 12px;
        accent-color: #1a73e8;
    }

    .checkbox-area label {
        font-size: 14px;
        color: #202124;
        font-weight: 400;
    }

    .button-area {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 20px;
    }

    .link-btn {
        background: none;
        border: none;
        color: #1a73e8;
        font-weight: 500;
        font-size: 14px;
        cursor: pointer;
        text-decoration: none;
        font-family: 'Roboto', Arial, sans-serif;
    }

    .link-btn:hover {
        background-color: #f6fafe;
        border-radius: 4px;
        padding: 8px 12px;
        margin: -8px -12px;
    }

    .btn-next {
        background-color: #1a73e8;
        color: #fff;
        border: none;
        border-radius: 4px;
        padding: 0 24px;
        height: 36px;
        font-weight: 500;
        font-size: 14px;
        cursor: pointer;
        font-family: 'Roboto', Arial, sans-serif;
        letter-spacing: 0.25px;
    }

    .btn-next:hover {
        background-color: #1765cc;
        box-shadow: 0 1px 2px 0 rgba(66,133,244,0.3), 0 1px 3px 1px rgba(66,133,244,0.15);
    }

    /* Alt Kısım Diller (İngilizce versiyon için) */
    .footer {
        margin-top: 36px;
        text-align: center;
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 8px 16px;
        font-size: 12px;
        color: #202124;
    }

    .footer span {
        cursor: pointer;
        color: #1a73e8;
    }

    .footer span:hover {
        background-color: #f6fafe;
        border-radius: 4px;
        padding: 0 4px;
    }

    /* Mobil için ayarlar */
    @media (max-width: 450px) {
        .container {
            border: none;
            padding: 24px;
            margin: 0;
            width: 100%;
            border-radius: 0;
        }
    }
</style>
</head>
<body>

<div class="container">
    <!-- 1. Google Logosu -->
    <img class="logo" src="https://www.gstatic.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" alt="Google">

    <!-- 2. Başlıklar -->
    <h1 class="title">Sign in</h1>
    <div class="subtitle">to continue to Gmail</div>

    <!-- 3. Profil ve Email -->
    <div class="profile-area">
        <svg class="profile-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span class="email-text">ramalahmadov53@gmail.com</span>
    </div>

    <!-- 4. Şifre Kutusu -->
    <div class="input-group">
        <input class="input-box" type="password" placeholder="Enter your password">
    </div>

    <!-- 5. Şifreyi Göster Checkbox -->
    <div class="checkbox-area">
        <input type="checkbox" id="showPass">
        <label for="showPass">Show password</label>
    </div>

    <!-- 6. Alt Butonlar -->
    <div class="button-area">
        <button class="link-btn">Forgot password?</button>
        <button class="btn-next">Next</button>
    </div>

    <!-- 7. Alt Kısım Diller (İngilizce) -->
    <div class="footer">
        <span>English (United States)</span>
        <span>español</span>
        <span>português (Brasil)</span>
        <span>français</span>
        <span>हिन्दी</span>
        <span style="color:#202124;">▼</span>
    </div>
</div>

</body>
    </html>
